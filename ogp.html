<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Noto+Sans+JP:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--cream:#f6efe0;--amber:#ffc95c;--mint:#7fdfb8}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    font-family:"Noto Sans JP","Inter",sans-serif;
    background:
      radial-gradient(780px 560px at 86% 30%, rgba(127,223,184,.15), transparent 62%),
      linear-gradient(150deg,#175c44,#124a36 55%,#0e3a2b);
    position:relative;color:var(--cream);
  }
  .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(246,239,224,.10) 1.5px,transparent 1.7px);background-size:30px 30px;
    -webkit-mask-image:linear-gradient(115deg,transparent 50%,#000)}
  .wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 72px}
  .left{max-width:680px}
  h1{font-size:96px;line-height:1.3;font-weight:900;letter-spacing:.02em;color:#fff}
  h1 .a{color:var(--amber);border-bottom:10px solid rgba(255,201,92,.85);padding-bottom:4px}
  .sub{margin-top:34px;font-size:25px;font-weight:700;color:#cfe3d8;line-height:1.65}
  .sub b{color:var(--mint)}
  .chips{display:flex;align-items:center;gap:12px;margin-top:34px}
  .chip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.10);border:1.5px solid rgba(255,255,255,.30);
    border-radius:999px;padding:10px 20px;font-size:19px;font-weight:800;color:#eaf5ef}
  .chip .a{color:var(--amber)}
  .right{flex-shrink:0;text-align:center;position:relative;margin-left:30px}
  .glow{position:absolute;inset:-56px;background:radial-gradient(closest-side,rgba(127,223,184,.30),transparent 70%);border-radius:50%}
  .right .big{position:relative;width:264px;height:264px;border-radius:56px;
    box-shadow:0 36px 74px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.14)}
  .right .name{position:relative;margin-top:22px;font-size:36px;font-weight:800;color:#fff;letter-spacing:.02em}
  .right .conn{position:relative;margin-top:8px;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:7px 16px;font-size:15.5px;font-weight:700;color:#d7e8df}
</style>
</head>
<body>
  <div class="dots"></div>
  <div class="wrap">
    <div class="left">
      <h1>経験は、<br><span class="a">検索</span>できる。</h1>
      <p class="sub">調べたことも、文献も、当直の学びも。<br>あなたの記録が、<b>現場で引き出せる</b>「検索データベース」に。</p>
      <div class="chips">
        <span class="chip">⌕ 検索</span><span class="chip">✓ 一問一答</span><span class="chip"><span class="a">無料</span>で始められる</span>
      </div>
    </div>
    <div class="right">
      <div class="glow"></div>
      <img class="big" src="assets/icon-512.png" alt="">
      <div class="name">MediNode</div>
      <div class="conn">🔗 いつものNotionにつなぐだけ</div>
    </div>
  </div>
</body>
</html>
